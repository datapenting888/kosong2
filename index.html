<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARSIP DASHBOARD — LIVE</title>
<style>
  :root{
    --bg: #0c0d10;
    --bg-panel: #17181c;
    --bg-panel-2: #1e2025;
    --line: #2a2c32;
    --gold-1: #f3c969;
    --gold-2: #b8862f;
    --text: #f0ede4;
    --text-dim: #8b8d94;
    --red: #d9694f;
    --orange: #e0a44f;
    --amber: #c9b04f;
    --gray: #6b6d74;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 500px at 12% -10%, rgba(243,201,105,0.07), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
  }
  .app{ display:flex; min-height:100vh; }

  /* ===== SIDEBAR ===== */
  .sidebar{
    width:270px; flex-shrink:0;
    background:var(--bg-panel); border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    height:100vh; position:sticky; top:0;
  }
  .sidebar-head{ padding:22px 18px 14px; border-bottom:1px solid var(--line); }
  .sidebar-head .eyebrow{
    font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold-1); margin:0 0 4px;
    display:flex; align-items:center; gap:6px;
  }
  .sidebar-head h1{
    font-family:'Georgia', serif; font-size:21px; font-weight:400; margin:0;
    background:linear-gradient(120deg, var(--gold-1), #fff3d6 40%, var(--gold-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .live-dot{ width:7px; height:7px; border-radius:50%; background:var(--good, #4fae6e); box-shadow:0 0 6px #4fae6e; }
  .live-dot.err{ background:var(--red); box-shadow:0 0 6px var(--red); }
  .sidebar-search{ padding:14px 16px; border-bottom:1px solid var(--line); }
  .sidebar-search input{
    width:100%; background:#101115; border:1px solid var(--line); color:var(--text);
    padding:9px 11px; border-radius:7px; font-size:13px; outline:none;
  }
  .sidebar-search input:focus{ border-color:var(--gold-2); }
  .site-list{ flex:1; overflow-y:auto; padding:8px; }
  .site-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:10px 12px; border-radius:8px; font-size:13.5px; color:#c9c7be;
    cursor:pointer; margin-bottom:2px; transition:background .12s;
  }
  .site-item:hover{ background:#1e2025; }
  .site-item.active{
    background:linear-gradient(90deg, rgba(243,201,105,0.16), rgba(243,201,105,0.03));
    color:var(--gold-1); font-weight:600;
    border-left:2px solid var(--gold-1); padding-left:10px;
  }
  .site-item .count{
    font-size:11px; color:var(--text-dim); background:#101115;
    border-radius:20px; padding:1px 8px; min-width:18px; text-align:center;
  }
  .site-item.active .count{ color:var(--gold-2); }
  .sidebar-foot{
    padding:14px 18px; border-top:1px solid var(--line);
    font-size:11px; color:var(--text-dim);
  }

  /* ===== MAIN ===== */
  main{ flex:1; padding:28px 32px 60px; min-width:0; }
  .main-top{
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap;
    gap:16px; margin-bottom:22px;
  }
  .main-top h2{ margin:0 0 4px; font-family:'Georgia', serif; font-size:26px; color:var(--text); }
  .main-top .sub{ font-size:12.5px; color:var(--text-dim); }
  .toolbar{ display:flex; gap:10px; }
  .toolbar button{
    background:var(--bg-panel); border:1px solid var(--line); color:var(--text);
    padding:9px 14px; border-radius:8px; font-size:13px; cursor:pointer;
  }
  .toolbar button.primary{
    background:linear-gradient(120deg, var(--gold-2), var(--gold-1)); color:#171307; border:none; font-weight:600;
  }
  .toolbar button:hover{ filter:brightness(1.08); }

  .stat-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:14px; margin-bottom:24px;
  }
  .stat{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line); border-radius:10px; padding:15px 18px; position:relative; overflow:hidden;
  }
  .stat::before{ content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:linear-gradient(180deg, var(--gold-1), var(--gold-2)); }
  .stat.warn::before{ background:linear-gradient(180deg, var(--orange), #8a5a2b); }
  .stat.bad::before{ background:linear-gradient(180deg, var(--red), #7a3423); }
  .stat .label{ font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
  .stat .value{ font-size:24px; color:var(--text); font-family:'Georgia', serif; }
  .stat.warn .value{ color:var(--orange); }
  .stat.bad .value{ color:var(--red); }
  .stat.good .value{ color:var(--gold-1); }

  .panel{ background:var(--bg-panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }

  .date-group{ border-bottom:1px solid var(--line); }
  .date-group:last-child{ border-bottom:none; }
  .date-head{
    background:#111318; padding:10px 20px; font-size:12px; letter-spacing:.08em;
    color:var(--gold-1); text-transform:uppercase; font-weight:600;
    display:flex; align-items:center; gap:8px;
  }
  .date-head::before{ content:'▸'; font-size:10px; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead.col-head th{
    text-align:left; padding:8px 20px; font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--text-dim); font-weight:600; border-bottom:1px solid #202227;
  }
  tbody td{ padding:10px 20px; border-bottom:1px solid #1c1e23; color:#dedbd0; vertical-align:middle; }
  tbody tr:hover{ background:rgba(243,201,105,0.05); }
  tbody tr:last-child td{ border-bottom:none; }
  td.name{ font-weight:600; color:#f0ede4; white-space:nowrap; }
  td.link a{ color:#7fb0d9; text-decoration:none; font-size:12.5px; }
  td.link a:hover{ text-decoration:underline; }

  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    font-size:11.5px; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .status-pill .dot{ width:6px; height:6px; border-radius:50%; }
  .status-fatal{ background:rgba(217,105,79,0.14); color:var(--red); }
  .status-fatal .dot{ background:var(--red); }
  .status-noresp{ background:rgba(224,164,79,0.14); color:var(--orange); }
  .status-noresp .dot{ background:var(--orange); }
  .status-note{ background:rgba(201,176,79,0.13); color:var(--amber); }
  .status-note .dot{ background:var(--amber); }
  .status-neutral{ background:rgba(139,141,148,0.14); color:var(--text-dim); }
  .status-neutral .dot{ background:var(--gray); }

  .empty{ padding:60px 20px; text-align:center; color:var(--text-dim); line-height:1.6; }
  .empty b{ color:var(--text); }
  .spin{
    width:26px; height:26px; border-radius:50%; border:2px solid #2c2e34; border-top-color:var(--gold-1);
    animation:spin 0.8s linear infinite; margin:0 auto 14px;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (max-width:820px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; }
    .site-list{ max-height:220px; }
    main{ padding:20px; }
    table, thead, tbody, th, td, tr{ display:block; }
    thead.col-head{ display:none; }
    tbody tr{ padding:12px 16px; border-bottom:1px solid var(--line); }
    td{ padding:3px 0 !important; border:none !important; }
    td.name{ font-size:14px; }
  }
  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:#2c2e34; border-radius:6px; }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-head">
      <p class="eyebrow"><span class="live-dot" id="liveDot"></span> Arsip Report · Live</p>
      <h1>DASHBOARD</h1>
    </div>
    <div class="sidebar-search">
      <input id="siteSearch" type="text" placeholder="Cari situs...">
    </div>
    <div class="site-list" id="siteList">
      <div style="padding:20px 12px; color:var(--text-dim); font-size:13px;">Memuat daftar situs dari spreadsheet...</div>
    </div>
    <div class="sidebar-foot">Klik salah satu untuk menarik data langsung dari sheet-nya</div>
  </aside>

  <main>
    <div class="main-top">
      <div>
        <h2 id="activeSiteTitle">—</h2>
        <div class="sub" id="activeSub">Log pengecekan &amp; respon spam link</div>
      </div>
      <div class="toolbar">
        <button id="refreshBtn">⟳ Refresh</button>
        <button class="primary" id="exportBtn">⬇ Export CSV</button>
      </div>
    </div>

    <div class="stat-row" id="statRow"></div>

    <div class="panel" id="resultPanel">
      <div class="empty"><div class="spin"></div>Menghubungkan ke spreadsheet...</div>
    </div>
  </main>

</div>

<script>
/* =========================================================
   KONFIGURASI — terhubung langsung ke spreadsheet aslinya
   ========================================================= */
  const SPREADSHEET_ID = "16AJAjj2Er9-qkkvWyO9F9LoaYUESAzOcpk5e7nyR2gg";
  const API_KEY = "AIzaSyBRNBQxfptX2-BF1gJ3eqVNMFi8ne63Qv0";
  // Kolom tempat data log berada di tiap tab/sheet (D=Nama, E=Link, F=Status),
  // sesuai posisi kolom di spreadsheet ARSIP kamu. Ubah di sini kalau posisinya beda.
  const DATA_RANGE = "D1:F2000";

  const el = id => document.getElementById(id);
  let SHEET_TABS = [];              // daftar nama tab, urut sesuai spreadsheet
  let SITE_DATA = {};               // cache: { tabName: { date: [records] } }
  let activeSite = null;
  let loadingSet = new Set();

  function setLive(ok){
    el('liveDot').className = 'live-dot' + (ok ? '' : ' err');
  }

  // ---- Ambil daftar semua tab/sheet dalam spreadsheet (ini yang jadi sidebar) ----
  async function fetchSheetTabs(){
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}?fields=sheets.properties.title&key=${API_KEY}`;
    const res = await fetch(url);
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error(`HTTP ${res.status} ${body.slice(0,160)}`);
    }
    const json = await res.json();
    return (json.sheets || []).map(s => s.properties.title);
  }

  // ---- Ambil data D:F dari satu tab tertentu, lalu susun jadi grup per tanggal ----
  function isDateLike(s){
    return /^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test((s||'').trim());
  }
  function isUrlLike(s){
    return /^https?:\/\//i.test((s||'').trim());
  }
  function statusFromNote(note){
    const n = (note||'').toLowerCase();
    if(n.includes('fatal')) return 'fatal';
    if(n.includes('tidak respon') || n.includes('tdk respon')) return 'noresp';
    if(n.includes('note') || n.includes('tidak melakukan') || n.includes('tidak teliti')) return 'note';
    return 'neutral';
  }

  async function fetchSiteData(siteName){
    if(SITE_DATA[siteName]) return SITE_DATA[siteName];
    const range = `'${siteName.replace(/'/g,"''")}'!${DATA_RANGE}`;
    const url = `https://sheets.googleapis.com/v4/spreadsheets/${SPREADSHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
    const res = await fetch(url);
    if(!res.ok){
      const body = await res.text().catch(()=> '');
      throw new Error(`HTTP ${res.status} ${body.slice(0,160)}`);
    }
    const json = await res.json();
    const rows = json.values || [];

    const groups = {};
    let currentDate = null;
    rows.forEach(r => {
      const d = (r[0] || '').trim();
      const name = (r[0] || '').trim();
      const link = (r[1] || '').trim();
      const status = (r[2] || '').trim();

      if(isDateLike(d) && !link && !status){
        currentDate = d;
        if(!groups[currentDate]) groups[currentDate] = [];
        return;
      }
      if(name && (link || status)){
        if(!currentDate){ currentDate = '(Tanpa tanggal)'; }
        if(!groups[currentDate]) groups[currentDate] = [];
        groups[currentDate].push({
          name, link,
          note: status || '—',
          status: statusFromNote(status)
        });
      }
    });

    SITE_DATA[siteName] = groups;
    return groups;
  }

  function countRecords(groups){
    if(!groups) return 0;
    return Object.values(groups).reduce((sum, arr) => sum + arr.length, 0);
  }

  function renderSiteList(filter=''){
    const q = filter.trim().toLowerCase();
    const list = SHEET_TABS.filter(s => s.toLowerCase().includes(q));
    el('siteList').innerHTML = list.map(s => {
      const count = SITE_DATA[s] ? countRecords(SITE_DATA[s]) : null;
      const badge = count === null ? '' : `<span class="count">${count}</span>`;
      return `<div class="site-item ${s===activeSite?'active':''}" data-site="${s}">
        <span>${s}</span>${badge}
      </div>`;
    }).join('');
    el('siteList').querySelectorAll('.site-item').forEach(item => {
      item.addEventListener('click', () => selectSite(item.dataset.site));
    });
  }

  function statusMeta(status){
    switch(status){
      case 'fatal': return { cls:'status-fatal' };
      case 'noresp': return { cls:'status-noresp' };
      case 'note': return { cls:'status-note' };
      default: return { cls:'status-neutral' };
    }
  }

  function renderStats(records){
    const total = records.length;
    const fatal = records.filter(r=>r.status==='fatal').length;
    const noresp = records.filter(r=>r.status==='noresp').length;
    const note = records.filter(r=>r.status==='note').length;
    el('statRow').innerHTML = `
      <div class="stat"><div class="label">Total Laporan</div><div class="value">${total}</div></div>
      <div class="stat bad"><div class="label">Fatal</div><div class="value">${fatal}</div></div>
      <div class="stat warn"><div class="label">Tidak Respon</div><div class="value">${noresp}</div></div>
      <div class="stat"><div class="label">Perlu Ditinjau</div><div class="value">${note}</div></div>
    `;
  }

  async function selectSite(siteName){
    activeSite = siteName;
    el('activeSiteTitle').textContent = siteName;
    renderSiteList(el('siteSearch').value);
    el('statRow').innerHTML = '';
    el('resultPanel').innerHTML = `<div class="empty"><div class="spin"></div>Menarik data dari tab "${siteName}"...</div>`;

    try{
      const groups = await fetchSiteData(siteName);
      renderSiteList(el('siteSearch').value); // update count badge
      const allRecords = Object.values(groups).flat();

      if(!allRecords.length){
        el('statRow').innerHTML = '';
        el('resultPanel').innerHTML = `<div class="empty">Belum ada data log di tab <b>${siteName}</b>,<br>atau struktur kolomnya berbeda dari D:E:F.</div>`;
        return;
      }

      renderStats(allRecords);
      let html = '';
      Object.entries(groups).forEach(([date, records]) => {
        if(!records.length) return;
        html += `<div class="date-group">
          <div class="date-head">${date}</div>
          <table>
            <thead class="col-head"><tr>
              <th style="width:30%;">Nama / ID</th>
              <th style="width:26%;">Link</th>
              <th>Status</th>
            </tr></thead>
            <tbody>`;
        records.forEach(r => {
          const meta = statusMeta(r.status);
          const linkHtml = r.link ? `<a href="${r.link}" target="_blank" rel="noopener">${r.link}</a>` : '—';
          html += `<tr>
            <td class="name">${r.name}</td>
            <td class="link">${linkHtml}</td>
            <td><span class="status-pill ${meta.cls}"><span class="dot"></span>${r.note}</span></td>
          </tr>`;
        });
        html += `</tbody></table></div>`;
      });
      el('resultPanel').innerHTML = html || `<div class="empty">Tidak ada data untuk ditampilkan.</div>`;
    } catch(err){
      console.error(err);
      el('statRow').innerHTML = '';
      el('resultPanel').innerHTML = `<div class="empty">
        Gagal menarik data dari tab <b>${siteName}</b>.<br>${err.message}<br><br>
        <span style="font-size:12px;">Pastikan nama tab di spreadsheet persis sama, sheet dapat diakses publik
        ("Anyone with the link can view"), dan API key tidak dibatasi domain.</span>
      </div>`;
    }
  }

  function exportCSV(){
    const groups = SITE_DATA[activeSite];
    if(!groups) return;
    const lines = ['Tanggal,Nama,Link,Status'];
    Object.entries(groups).forEach(([date, records]) => {
      records.forEach(r => {
        lines.push(`"${date}","${r.name}","${r.link}","${r.note.replace(/"/g,'""')}"`);
      });
    });
    const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `arsip_${activeSite}.csv`; a.click();
    URL.revokeObjectURL(url);
  }

  async function init(){
    try{
      SHEET_TABS = await fetchSheetTabs();
      if(!SHEET_TABS.length) throw new Error('Tidak ada tab ditemukan di spreadsheet ini');
      setLive(true);
      renderSiteList();
      await selectSite(SHEET_TABS[0]);
    } catch(err){
      console.error(err);
      setLive(false);
      el('siteList').innerHTML = `<div style="padding:16px 12px; color:var(--red); font-size:13px;">Gagal memuat daftar tab: ${err.message}</div>`;
      el('resultPanel').innerHTML = `<div class="empty">
        Tidak bisa terhubung ke spreadsheet.<br><br>
        <span style="font-size:12px;">Pastikan spreadsheet di-set "Anyone with the link can view",
        dan API key aktif untuk Google Sheets API di Google Cloud Console.</span>
      </div>`;
    }
  }

  el('siteSearch').addEventListener('input', e => renderSiteList(e.target.value));
  el('refreshBtn').addEventListener('click', () => { if(activeSite){ delete SITE_DATA[activeSite]; selectSite(activeSite); } });
  el('exportBtn').addEventListener('click', exportCSV);

  init();
</script>
</body>
</html>
