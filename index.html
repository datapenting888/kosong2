<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo to URL Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .upload-box {
            border: 2px dashed #00b894;
            padding: 20px;
            border-radius: 8px;
            background: #fdfdfd;
            cursor: pointer;
            margin-bottom: 20px;
        }
        input[type="file"] { display: none; }
        .file-label {
            display: block;
            color: #00b894;
            font-weight: bold;
            cursor: pointer;
        }
        button {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #019875; }
        #result { margin-top: 20px; word-break: break-all; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Photo to URL Converter</h2>
        
        <!-- Menggunakan layanan Catbox.moe API publik yang ramah untuk script sederhana -->
        <form id="uploadForm" onsubmit="uploadImage(event)">
            <div class="upload-box" onclick="document.getElementById('imageFile').click()">
                <span class="file-label" id="fileLabel">📂 Pilih Foto</span>
                <input type="file" id="imageFile" name="fileToUpload" accept="image/*" required onchange="showFileName()">
            </div>
            <button type="submit" id="submitBtn">Ubah Menjadi Link</button>
        </form>
        
        <div id="result"></div>
    </div>

    <script>
        function showFileName() {
            const fileInput = document.getElementById('imageFile');
            const fileLabel = document.getElementById('fileLabel');
            if (fileInput.files.length > 0) {
                fileLabel.innerText = "Terpilih: " + fileInput.files[0].name;
            }
        }

        async function uploadImage(event) {
            event.preventDefault();
            const fileInput = document.getElementById('imageFile');
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');

            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append("reqtype", "fileupload");
            formData.append("fileToUpload", fileInput.files[0]);

            resultDiv.innerHTML = `<p style="color: #e17055; font-weight: bold;">Sedang mengunggah...</p>`;
            submitBtn.disabled = true;

            try {
                // Menggunakan endpoint publik Catbox yang mendukung akses lintas-domain (CORS)
                const response = await fetch("https://catbox.moe/api.php", {
                    method: "POST",
                    body: formData
                });

                const link = await response.text();

                if (link.startsWith("http")) {
                    resultDiv.innerHTML = `
                        <div style="background: #e8f8f5; padding: 10px; border-radius: 6px; border: 1px solid #00b894;">
                            <p><strong>Berhasil! Link Gambar Anda:</strong></p>
                            <a href="${link}" target="_blank">${link}</a>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Gagal mengunggah. Coba lagi.</p>`;
                }
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = `<p style="color: red;">Terjadi kesalahan sistem.</p>`;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
