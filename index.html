<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo to URL Instan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }
        h2 { color: #333; margin-bottom: 20px; }
        .upload-box {
            border: 2px dashed #00b894;
            padding: 20px;
            border-radius: 8px;
            background: #fdfdfd;
            cursor: pointer;
            margin-bottom: 20px;
        }
        input[type="file"] { display: none; }
        .file-label {
            display: block;
            color: #00b894;
            font-weight: bold;
            cursor: pointer;
        }
        button {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background-color: #019875; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Photo to URL Converter</h2>
        
        <!-- Menggunakan form langsung ke Postimages API publik agar lolos dari blokir CORS -->
        <form action="https://postimages.org/" method="post" enctype="multipart/form-data" target="_blank">
            <div class="upload-box" onclick="document.getElementById('imageFile').click()">
                <span class="file-label" id="fileLabel">📂 Pilih Foto</span>
                <input type="file" id="imageFile" name="file[]" accept="image/*" required onchange="showFileName()">
            </div>
            <button type="submit">Ubah Menjadi Link</button>
        </form>
    </div>

    <script>
        function showFileName() {
            const fileInput = document.getElementById('imageFile');
            const fileLabel = document.getElementById('fileLabel');
            if (fileInput.files.length > 0) {
                fileLabel.innerText = "Terpilih: " + fileInput.files[0].name;
            }
        }
    </script>

</body>
</html>
