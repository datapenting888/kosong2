<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Photo to URL Sendiri</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }
        h2 {
            color: #333;
            margin-bottom: 20px;
        }
        .upload-box {
            border: 2px dashed #00b894;
            padding: 20px;
            border-radius: 8px;
            background: #fdfdfd;
            cursor: pointer;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .file-label {
            display: block;
            color: #00b894;
            font-weight: bold;
            cursor: pointer;
        }
        button {
            background-color: #00b894;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #019875;
        }
        #result {
            margin-top: 20px;
            word-break: break-all;
            text-align: left;
        }
        .loading {
            color: #e17055;
            font-weight: bold;
        }
        .success-box {
            background: #e8f8f5;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #00b894;
        }
        .success-box a {
            color: #0984e3;
            text-decoration: none;
            font-weight: bold;
        }
        .success-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Photo to URL Converter</h2>
        
        <div class="upload-box" onclick="document.getElementById('imageFile').click()">
            <span class="file-label" id="fileLabel">📂 Pilih atau Klik untuk Unggah Foto</span>
            <input type="file" id="imageFile" accept="image/*" onchange="showFileName()">
        </div>

        <button onclick="uploadImage()">Ubah Menjadi Link</button>
        
        <div id="result"></div>
    </div>

    <script>
        function showFileName() {
            const fileInput = document.getElementById('imageFile');
            const fileLabel = document.getElementById('fileLabel');
            if (fileInput.files.length > 0) {
                fileLabel.innerText = "Terpilih: " + fileInput.files[0].name;
            }
        }

        async function uploadImage() {
            const fileInput = document.getElementById('imageFile');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert("Silakan pilih foto terlebih dahulu!");
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append("image", file);

            resultDiv.innerHTML = `<p class="loading">Sedang mengunggah foto, mohon tunggu...</p>`;

            try {
                // Menggunakan sistem API Imgur dengan Client ID siap pakai
                const response = await fetch("https://api.imgur.com/3/image", {
                    method: "POST",
                    headers: {
                        "Authorization": "Client-ID c481d7f022797e8" 
                    },
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    const imageUrl = data.data.link;
                    resultDiv.innerHTML = `
                        <div class="success-box">
                            <p><strong>Berhasil! Link Gambar Anda:</strong></p>
                            <a href="${imageUrl}" target="_blank">${imageUrl}</a>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `<p style="color: red;">Gagal mengunggah gambar. Silakan coba lagi.</p>`;
                }
            } catch (error) {
                console.error("Error:", error);
                resultDiv.innerHTML = `<p style="color: red;">Terjadi kesalahan koneksi jaringan.</p>`;
            }
        }
    </script>

</body>
</html>
